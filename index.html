<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Things You Should Know</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <header id="top-bar">
    <a href="#home" class="logo">Things You Should Know</a>
    <div class="stats-bar">
      <span id="xp-display" title="Experience Points">&#9889; 0 XP</span>
      <span id="streak-display" title="Daily Streak">&#128293; 0 days</span>
      <span id="level-display" title="Level">Lvl 1</span>
    </div>
    <nav>
      <a href="#home">Home</a>
      <a href="#stats">Stats</a>
      <a href="#settings">Settings</a>
    </nav>
  </header>

  <!-- Screen: Home / Chapter Selection -->
  <main id="screen-home" class="screen">
    <h1>Choose a Chapter</h1>
    <div id="chapter-grid" class="chapter-grid"></div>
  </main>

  <!-- Screen: Quiz -->
  <main id="screen-quiz" class="screen" style="display:none">
    <div id="quiz-header">
      <button id="btn-back" class="btn-secondary">&#8592; Back</button>
      <span id="quiz-chapter-title"></span>
      <span id="quiz-progress">Card 1 / 20</span>
      <span id="quiz-score">Score: 0</span>
    </div>

    <div id="flashcard-container">
      <div id="flashcard" class="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-front" id="card-front">
            <div class="card-subcategory" id="card-subcategory"></div>
            <div class="card-content" id="card-front-content"></div>
            <div class="card-hint" id="card-hint"></div>
          </div>
          <div class="flashcard-back" id="card-back">
            <div class="card-content" id="card-back-content"></div>
            <div class="card-notes" id="card-notes"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Timer bar (visible only when timer mode is ON) -->
    <div id="timer-bar" style="display:none">
      <div class="timer-bar-bg">
        <div class="timer-bar-fill" id="timer-fill"></div>
      </div>
      <span id="timer-text">15s</span>
    </div>

    <!-- Unified answer controls -->
    <div id="answer-controls" class="quiz-controls">
      <div class="answer-row">
        <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off">
        <button id="btn-submit" class="btn-primary">Submit</button>
      </div>
      <button id="btn-dont-know" class="btn-secondary">I don't know (yet)</button>
    </div>
  </main>

  <!-- Screen: Results -->
  <main id="screen-results" class="screen" style="display:none">
    <div id="results-content"></div>
  </main>

  <!-- Screen: Stats -->
  <main id="screen-stats" class="screen" style="display:none">
    <div id="stats-content"></div>
  </main>

  <!-- Screen: Settings -->
  <main id="screen-settings" class="screen" style="display:none">
    <div id="settings-content"></div>
  </main>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Data files -->
  <script src="data/chapters.js"></script>
  <script src="data/spanish.js"></script>
  <script src="data/french.js"></script>
  <script src="data/portuguese.js"></script>
  <script src="data/countries.js"></script>
  <script src="data/periodic-table.js"></script>
  <script src="data/history.js"></script>

  <!-- Application JS -->
  <script src="js/router.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
